name: MRN Operations service tests
on:
  pull_request:
    paths:
      - tools/operations/**
      - stack/scripts/mrn-fleet-update.mjs
      - stack/scripts/build-mainwp-stack-plugin-plan.py
      - .github/workflows/operations-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controlled-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/operations/package-lock.json
      - name: Install exact service dependencies
        run: npm ci --ignore-scripts --prefix tools/operations
      - name: Operations authorization, protocol and failure contracts
        run: npm run lint --prefix tools/operations && npm test --prefix tools/operations
      - name: Existing Fleet contract regression
        run: node --test stack/tests/test_mrn_fleet_update.mjs
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high --prefix tools/operations

  provider-transport:
    name: Disposable gateway MainWP transport
    needs: controlled-contracts
    runs-on: ubuntu-24.04
    # The expanded suite produced all eight passing reports at 25f5d35, then
    # reached the 25-minute job cap during final validation/cleanup. Allow room
    # for the complete suite and artifact retention, not longer operations:
    # Individual request/authority deadlines are independently enforced. The
    # synthetic grant and aggregate native-hook allocation are pinned below.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read immutable integration inputs
        id: sources
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const lock = JSON.parse(readFileSync('tools/operations/test/runtime/sources.json', 'utf8'));
          assert.equal(lock.schema, 1);
          for (const [name, repository] of [['provider', 'mrnwebdesigns/mrn-mainwp-operations-api'], ['transport', 'mrnwebdesigns/mainwp-mcp'], ['runner', 'mrnwebdesigns/mrn-code-qa-runner'], ['managementWorker', 'mrnwebdesigns/mrn-code-qa-runner']]) {
            assert.equal(lock[name].repository, repository);
            assert.match(lock[name].commit, /^[a-f0-9]{40}$/);
            appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${lock[name].commit}\n`);
          }
          JS
      - name: Request existing read-only access to pinned provider and runner sources
        id: provider-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MRN_CI_STANDALONE_REPOS_APP_ID }}
          private-key: ${{ secrets.MRN_CI_STANDALONE_REPOS_PRIVATE_KEY }}
          owner: mrnwebdesigns
          repositories: |
            mrn-mainwp-operations-api
            mrn-code-qa-runner
          permission-contents: read
      - name: Check out the accepted provider checkpoint
        uses: actions/checkout@v4
        with:
          repository: mrnwebdesigns/mrn-mainwp-operations-api
          ref: ${{ steps.sources.outputs.provider }}
          token: ${{ steps.provider-token.outputs.token }}
          path: .runtime/provider
          persist-credentials: false
      - name: Check out the canonical MCP transport
        uses: actions/checkout@v4
        with:
          repository: mrnwebdesigns/mainwp-mcp
          ref: ${{ steps.sources.outputs.transport }}
          path: .runtime/transport
          persist-credentials: false
      - name: Check out the qualified acquisition runner
        uses: actions/checkout@v4
        with:
          repository: mrnwebdesigns/mrn-code-qa-runner
          ref: ${{ steps.sources.outputs.runner }}
          token: ${{ steps.provider-token.outputs.token }}
          path: .runtime/runner
          persist-credentials: false
      - name: Check out the management context reader candidate
        uses: actions/checkout@v4
        with:
          repository: mrnwebdesigns/mrn-code-qa-runner
          ref: ${{ steps.sources.outputs.managementWorker }}
          token: ${{ steps.provider-token.outputs.token }}
          path: .runtime/management-worker
          persist-credentials: false
      - name: Install locked test dependencies and build MCP
        run: |
          npm ci --ignore-scripts --prefix tools/operations
          npm ci --ignore-scripts --prefix .runtime/transport
          npm run build --prefix .runtime/transport
      - name: Verify private capture transport size and deadlines
        env:
          MRN_GATEWAY_MCP_SOURCE: ${{ github.workspace }}/.runtime/transport
          MRN_CAPTURE_TRANSPORT_REPORT: ${{ runner.temp }}/capture-transport-report.json
        run: node tools/operations/test/runtime/check-capture-transport.mjs
      - name: Verify original dispatch readback between gateway and protected worker
        env:
          MRN_GATEWAY_MANAGEMENT_RUNNER_SOURCE: ${{ github.workspace }}/.runtime/management-worker
          MRN_GATEWAY_RUNNER_SOURCE: ${{ github.workspace }}/.runtime/runner
          MRN_GATEWAY_PROVIDER_SOURCE: ${{ github.workspace }}/.runtime/provider
        run: node tools/operations/test/runtime/check-management-worker.mjs
      - name: Exercise actual gateway, MCP and WordPress authorization
        env:
          MRN_DISPOSABLE_API_HOOK: ${{ github.workspace }}/tools/operations/test/runtime/provider-hook.sh
          MRN_DISPOSABLE_NATIVE_CHILD: '1'
          MRN_DISPOSABLE_SYNC_AUTH_DIAGNOSTICS: '1'
          MRN_DISPOSABLE_MANAGEMENT_TEST: '1'
          MRN_DISPOSABLE_SOURCE_TEST: '1'
          # Separate cloned Dashboard; never initializes the legacy fixture.
          MRN_DISPOSABLE_EXISTING_BINDING_TEST: '1'
          MRN_DISPOSABLE_EXISTING_BINDING_HOOK: ${{ github.workspace }}/tools/operations/test/runtime/existing-binding-hook.sh
          # Qualified provider; actual gateway custody remains a required CI gate.
          MRN_DISPOSABLE_REPORT_CUSTODY_TEST: '1'
          MRN_DISPOSABLE_NATIVE_HOOK: ${{ github.workspace }}/tools/operations/test/runtime/native-hook.sh
          MRN_DISPOSABLE_ACCESS_HOOK: ${{ github.workspace }}/tools/operations/test/runtime/access-hook.sh
          MRN_DISPOSABLE_SOURCE_HOOK: ${{ github.workspace }}/tools/operations/test/runtime/source-hook.sh
          MRN_GATEWAY_MCP_SOURCE: ${{ github.workspace }}/.runtime/transport
          MRN_GATEWAY_REPORT: ${{ runner.temp }}/gateway-provider-report.json
          MRN_GATEWAY_PROVIDER_SOURCE: ${{ github.workspace }}/.runtime/provider
          MRN_GATEWAY_RUNNER_SOURCE: ${{ github.workspace }}/.runtime/runner
          MRN_GATEWAY_MANAGEMENT_RUNNER_SOURCE: ${{ github.workspace }}/.runtime/management-worker
          MRN_GATEWAY_NATIVE_REPORT: ${{ runner.temp }}/gateway-native-content-report.json
          MRN_GATEWAY_ACCESS_REPORT: ${{ runner.temp }}/gateway-access-report.json
          MRN_GATEWAY_MANAGEMENT_REPORT: ${{ runner.temp }}/gateway-management-report.json
          MRN_GATEWAY_SOURCE_REPORT: ${{ runner.temp }}/gateway-native-source-report.json
          MRN_GATEWAY_REPORT_CUSTODY_REPORT: ${{ runner.temp }}/gateway-report-custody-report.json
          MRN_GATEWAY_EXISTING_BINDING_REPORT: ${{ runner.temp }}/gateway-existing-binding-report.json
        run: |
          .runtime/provider/tests/runtime/run-dashboard-api.sh
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const proof = JSON.parse(readFileSync(process.env.MRN_GATEWAY_REPORT, 'utf8'));
          assert.equal(proof.result, 'PASS');
          assert.equal(proof.passed.length, 10);
          assert.equal(proof.productionCredentials, false);
          assert.equal(proof.chatgptAcceptanceVerified, false);
          const native = JSON.parse(readFileSync(process.env.MRN_GATEWAY_NATIVE_REPORT, 'utf8'));
          assert.equal(native.result, 'PASS');
          assert.equal(native.passed.length, 8);
          assert.equal(native.scope, 'disposable-native-child-only');
          assert.equal(native.managedSites, 1);
          for (const field of ['contentWriteVerified', 'contentRollbackVerified', 'publicHtmlVerified']) assert.equal(native[field], true);
          assert.equal(native.structuredManagementReadsVerified, true);
          assert.equal(native.managementReadOnlyScopeVerified, true);
          assert.equal(native.managementWritesVerified, false);
          for (const field of ['productionCredentials', 'liveGoogleVerified', 'protectedQaVerified', 'productionQaVerified', 'remoteBackupVerified', 'chatgptAcceptanceVerified', 'codeWriteVerified']) assert.equal(native[field], false);
          const access = JSON.parse(readFileSync(process.env.MRN_GATEWAY_ACCESS_REPORT, 'utf8'));
          assert.equal(access.result, 'PASS');
          assert.equal(access.passed.length, 11);
          assert.equal(access.scope, 'disposable-native-access-only');
          for (const field of ['captureVerified', 'pendingDuringReadVerified', 'retainedCaptureRecoveryVerified', 'pendingRecoveryDenied', 'currentSitePermissionVerified', 'privateLifecycleVerified', 'measurementReadbackVerified', 'measurementSitePermissionVerified', 'pendingMeasurementsDenied', 'nodeAcquisitionVerified', 'nodeAcquisitionDenialsVerified']) assert.equal(access[field], true);
          for (const field of ['productionCredentials', 'liveGoogleVerified', 'protectedWorkerVerified', 'chatgptAcceptanceVerified', 'codeWriteVerified', 'contentWriteVerified', 'remoteBackupVerified']) assert.equal(access[field], false);
          const management = JSON.parse(readFileSync(process.env.MRN_GATEWAY_MANAGEMENT_REPORT, 'utf8'));
          assert.equal(management.result, 'PASS');
          assert.equal(management.passed.length, 6);
          assert.equal(management.scope, 'disposable-native-management-access-only');
          for (const field of ['managementCallbackVerified', 'originalIntentVerified', 'completeCaptureVerified', 'independentReadbackVerified', 'retainedMeasurementsVerified', 'currentPermissionVerified', 'pendingDuringReadVerified', 'pendingRecoveryDenied', 'childUnchangedVerified']) assert.equal(management[field], true);
          for (const field of ['productionCredentials', 'liveGoogleVerified', 'protectedWorkerVerified', 'renderedQaVerified', 'consumerBindingIssued', 'contentWriteVerified', 'remoteBackupVerified', 'chatgptAcceptanceVerified']) assert.equal(management[field], false);
          assert.ok(management.capture.measurements.readback_bytes > 65535);
          assert.ok(management.capture.measurements.readback_chunks > 1);
          assert.ok(management.callbackPosts > 0);
          assert.equal(management.draftRecordReadVerified, true);
          assert.equal(management.publishedTargetVerified, true);
          const source = JSON.parse(readFileSync(process.env.MRN_GATEWAY_SOURCE_REPORT, 'utf8'));
          assert.equal(source.result, 'PASS');
          assert.equal(source.scope, 'disposable-native-source-integration');
          assert.deepEqual(source.passed, [
            'fresh-original-Google-intent-and-actual-native-capture-readback',
            'canonical-MCP-bootstrap-and-native-source-capture-retain-one-original-slot',
            'independent-worker-reads-signed-original-metadata-and-binds-recipient-over-TLS',
            'actual-provider-native-frames-cross-encrypted-broker-and-independent-decryption',
            'complete-real-cache-and-native-source-reconstruction-independently-reopened',
            'original-pending-revocation-denies-provider-bootstrap-and-protected-source',
            'original-child-content-unchanged-without-candidate-execution',
          ]);
          for (const field of ['providerSourceBootstrapVerified', 'nativeSourceCaptureVerified', 'sourceBrokerTlsVerified', 'fullSourceBytesVerified', 'originalRevocationVerified']) assert.equal(source[field], true);
          for (const field of ['productionCredentials', 'liveGoogleVerified', 'hostedOidcVerified', 'hostedCacheProvenanceVerified', 'protectedRenderedQaVerified', 'consumerBindingIssued', 'contentWriteVerified', 'remoteBackupVerified', 'chatgptAcceptanceVerified']) assert.equal(source[field], false);
          for (const field of ['manifest_sha256', 'parity_sha256', 'transfer_manifest_sha256']) assert.match(source.sourceClosure[field], /^[a-f0-9]{64}$/);
          const sourceLimits = JSON.parse(readFileSync('tools/operations/contracts/content-management-source-transfer-v1.json', 'utf8')).limits;
          for (const [field, maximum] of [['cache_artifacts', 128], ['native_files', sourceLimits.native_files], ['native_bytes', sourceLimits.native_bytes], ['source_frames', sourceLimits.total_frames]]) {
            assert.ok(Number.isSafeInteger(source.sourceClosure[field]) && source.sourceClosure[field] > 0 && source.sourceClosure[field] <= maximum);
          }
          assert.ok(['0', '1'].includes(process.env.MRN_DISPOSABLE_REPORT_CUSTODY_TEST));
          let custody;
          if (process.env.MRN_DISPOSABLE_REPORT_CUSTODY_TEST === '1') {
            custody = JSON.parse(readFileSync(process.env.MRN_GATEWAY_REPORT_CUSTODY_REPORT, 'utf8'));
            assert.equal(custody.result, 'PASS');
            assert.equal(custody.scope, 'disposable-native-report-custody');
            assert.deepEqual(custody.syntheticObservations, ['rendered_runtime', 'wordpress_http_transcript', 'github_run_and_artifacts']);
            assert.deepEqual(custody.passed, [
              'signed-native-packet-preserves-original-dispatch-and-separate-QA-authority',
              'actual-MCP-retention-completes-through-Node-TLS-callback-and-distinct-role-keys',
              'fresh-MCP-readback-matches-original-report-and-both-archive-hashes',
              'consumed-acquisition-cannot-retry-or-mint-another-callback',
              'fresh-original-revocation-denies-unused-report-read',
            ]);
            for (const field of ['productionCredentials', 'liveGoogleVerified', 'hostedProvenanceVerified', 'protectedRenderedQaVerified', 'consumerBindingIssued', 'contentWriteVerified', 'remoteBackupVerified', 'chatgptAcceptanceVerified']) assert.equal(custody[field], false);
            assert.deepEqual(custody.callback, { requests: 1, completed: 1, queryReads: 1 });
            assert.deepEqual(custody.syntheticObservationStages, ['run', 'inventory', 'qualification', 'acquisition', 'finish']);
            assert.equal(Object.hasOwn(custody, 'failures'), false);
            assert.equal(custody.retained.state, 'retained');
            assert.equal(custody.retained.consumer_binding_issued, false);
            assert.equal(custody.retained.production_qualified, false);
            for (const field of ['management_context_sha256', 'qualification_report_sha256', 'qualification_archive_sha256', 'acquisition_archive_sha256', 'acquisition_observation_sha256', 'evidence_policy_sha256']) assert.match(custody.retained[field], /^[a-f0-9]{64}$/);
          }
          const sources = JSON.parse(readFileSync('tools/operations/test/runtime/sources.json', 'utf8'));
          const binding = JSON.parse(readFileSync(process.env.MRN_GATEWAY_EXISTING_BINDING_REPORT, 'utf8'));
          assert.equal(binding.schema, 2); assert.equal(binding.result, 'PASS');
          assert.equal(binding.scope, 'disposable-native-existing-queue-access-v2-only');
          assert.deepEqual(binding.passed, [
            'Separate synthetic v2 descriptor and installed immutable source independently verified',
            'Actual signed preview and complete candidate reconstruction retain the original verified actor and epoch',
            'One actual provider bind succeeds before a simulated lost response; no local receipt or retry is created',
            'SQLite reopen and a fresh authenticated login recover the exact binding by signed read without extending the original grant',
            'Actual signed qualification queues the retained original once with unchanged grant and intent ceilings',
            'Actual registrar context request triggers the provider TLS callback and separate signed identity readback',
            'One native capture survives a lost response and SQLite reopen with identical bounded read recovery and no recapture',
            'Native measurement read matches the independently retained capture receipt under the original authority',
            'Fresh exact-site sync and full Child readback prove the preview, binding and qualification did not edit content',
            'Revocation during actual provider context lookup returns a signed denial and blocks later local dispatch',
          ]);
          for (const field of ['productionCredentials', 'productionActivation', 'liveGoogleVerified', 'protectedWorkerVerified',
            'renderedQaVerified', 'consumerBindingIssued', 'contentWriteVerified', 'codeWriteVerified', 'remoteBackupVerified',
            'chatgptAcceptanceVerified', 'afterTransportExpiryVerified']) assert.equal(binding[field], false);
          assert.equal(Object.hasOwn(binding, 'failure'), false);
          assert.equal(binding.pins.provider_source_sha, sources.provider.commit);
          assert.equal(Object.keys(binding.pins).length, 8);
          for (const field of ['installed_manifest_sha256', 'source_binding_sha256', 'authorization_policy_sha256',
            'delegation_policy_sha256', 'coherence_epoch_sha256', 'qualification_catalog_sha256', 'qualification_authority_sha256'])
            assert.match(binding.pins[field], /^[a-f0-9]{64}$/);
          for (const field of ['reviewed_digest', 'original_authorization_sha256', 'projection_sha256', 'receipt_sha256', 'coherence_epoch_sha256'])
            assert.match(binding.binding[field], /^[a-f0-9]{64}$/);
          for (const field of ['original_request_id', 'operation_id']) assert.match(binding.binding[field], /^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$/);
          assert.equal(binding.binding.coherence_epoch_sha256, binding.pins.coherence_epoch_sha256);
          assert.equal(binding.binding.bind_dispatches, 1); assert.equal(binding.binding.read_dispatches, 1);
          assert.ok(Number.isSafeInteger(binding.binding.original_expires_at) && binding.binding.original_expires_at > 0);
          assert.match(binding.qualification.job_id, /^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$/);
          assert.match(binding.qualification.context_sha256, /^[a-f0-9]{64}$/);
          assert.equal(binding.qualification.dispatches, 1);
          assert.deepEqual(binding.queueConfirmation, { phases: [false, true], same_input: true,
            http_before: [0, 0], http_after: [0, 1] });
          assert.equal(binding.qualification.original_expires_at, binding.binding.original_expires_at);
          assert.ok(Number.isSafeInteger(binding.qualification.job_expires_at) && binding.qualification.job_expires_at > 0
            && binding.qualification.job_expires_at <= binding.binding.original_expires_at);
          assert.equal(binding.capture.dispatches, 1); assert.equal(binding.capture.recovery_reads, 1);
          assert.equal(binding.capture.uncertain_before_recovery, true);
          for (const field of ['artifact_sha256', 'measurements_sha256', 'binding_sha256']) assert.match(binding.capture[field], /^[a-f0-9]{64}$/);
          assert.equal(binding.capture.binding_sha256, binding.qualification.context_sha256);
          assert.equal(binding.capture.original_expires_at, binding.binding.original_expires_at);
          assert.equal(binding.capture.job_expires_at, binding.qualification.job_expires_at);
          assert.ok(Number.isSafeInteger(binding.capture.native_calls) && binding.capture.native_calls >= 2 && binding.capture.native_calls <= 151);
          assert.deepEqual(binding.measurements, { reads: 1, measurement_record_sha256: binding.capture.measurements_sha256,
            matches_retained_capture: true, original_authorization_unchanged: true, admitted: false });
          assert.ok(Number.isSafeInteger(binding.currentAccess.signed_callbacks) && binding.currentAccess.signed_callbacks >= binding.capture.native_calls + 4
            && binding.currentAccess.signed_callbacks <= 512);
          assert.deepEqual(binding.currentAccess, { context_requests: 2, signed_callbacks: binding.currentAccess.signed_callbacks,
            clear: binding.currentAccess.signed_callbacks - 1, pending_revocation: 1,
            repeated_revoked_read_dispatched: false });
          assert.equal(binding.callbackRouteDisabled, true);
          assert.equal(binding.child.site.site_url, 'https://child.fixture.example.invalid');
          assert.ok(Number.isSafeInteger(binding.child.site.site_id) && binding.child.site.site_id > 0);
          assert.equal(binding.child.target.kind, 'wordpress-content'); assert.equal(binding.child.target.post_type, 'page');
          assert.ok(Number.isSafeInteger(binding.child.target.post_id) && binding.child.target.post_id > 0);
          assert.match(binding.child.before_sha256, /^[a-f0-9]{64}$/); assert.equal(binding.child.after_sha256, binding.child.before_sha256);
          assert.equal(binding.network.signed_control_posts, 2); assert.match(binding.network.network_log_sha256, /^[a-f0-9]{64}$/);
          assert.equal(binding.network.context_posts, 2); assert.equal(binding.network.access_readback_posts, binding.currentAccess.signed_callbacks);
          assert.equal(binding.network.capture_posts, 1); assert.equal(binding.network.recovery_posts, 1);
          assert.equal(binding.network.measurement_posts, 1);
          assert.equal(binding.network.queue_posts, 1);
          assert.equal(binding.staffChecks.connections, 1);
          assert.ok(Number.isSafeInteger(binding.staffChecks.dispatched) && binding.staffChecks.dispatched > 0);
          assert.equal(binding.staffChecks.dispatched, binding.staffChecks.completed);
          assert.equal(binding.staffChecks.completed, binding.staffChecks.verified_posts);
          assert.deepEqual(binding.fixtureLimits, { initial_grant_seconds: 300, hook_seconds: 300, owner_wait_seconds: 320 });
          assert.equal(binding.aggregateDeadlineExceeded, false);
          assert.ok(Number.isSafeInteger(binding.elapsedMs) && binding.elapsedMs > 0 && binding.elapsedMs < 300000);
          for (const name of ['provider', 'transport', 'runner']) assert.equal(execFileSync('git', ['-C', `.runtime/${name}`, 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), sources[name].commit);
          assert.equal(execFileSync('git', ['-C', '.runtime/management-worker', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), sources.managementWorker.commit);
          for (const report of [proof, native, access, management, source, binding, ...(custody ? [custody] : [])]) assert.deepEqual(report.source, sources);
          JS
      - name: Retain redacted disposable worker failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-provider-worker-failure
          path: .runtime/provider/reports/native-job-worker-failure.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain bounded integration evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-provider-transport
          path: |
            ${{ runner.temp }}/gateway-provider-report.json
            ${{ runner.temp }}/gateway-native-content-report.json
            ${{ runner.temp }}/capture-transport-report.json
            ${{ runner.temp }}/gateway-access-report.json
            ${{ runner.temp }}/gateway-management-report.json
            ${{ runner.temp }}/gateway-native-source-report.json
            ${{ runner.temp }}/gateway-report-custody-report.json
            ${{ runner.temp }}/gateway-existing-binding-report.json
          if-no-files-found: error
          retention-days: 14
