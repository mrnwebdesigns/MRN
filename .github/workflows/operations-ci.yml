name: MRN Operations service tests
on:
  pull_request:
    paths:
      - tools/operations/**
      - stack/scripts/mrn-fleet-update.mjs
      - stack/scripts/build-mainwp-stack-plugin-plan.py
      - .github/workflows/operations-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controlled-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/operations/package-lock.json
      - name: Install exact service dependencies
        run: npm ci --ignore-scripts --prefix tools/operations
      - name: Operations authorization, protocol and failure contracts
        run: npm run lint --prefix tools/operations && npm test --prefix tools/operations
      - name: Existing Fleet contract regression
        run: node --test stack/tests/test_mrn_fleet_update.mjs
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high --prefix tools/operations

  provider-transport:
    name: Disposable gateway MainWP transport
    needs: controlled-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read immutable integration inputs
        id: sources
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const lock = JSON.parse(readFileSync('tools/operations/test/runtime/sources.json', 'utf8'));
          assert.equal(lock.schema, 1);
          for (const [name, repository] of [['provider', 'mrnwebdesigns/mrn-mainwp-operations-api'], ['transport', 'mrnwebdesigns/mainwp-mcp'], ['runner', 'mrnwebdesigns/mrn-code-qa-runner'], ['managementWorker', 'mrnwebdesigns/mrn-code-qa-runner']]) {
            assert.equal(lock[name].repository, repository);
            assert.match(lock[name].commit, /^[a-f0-9]{40}$/);
            appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${lock[name].commit}\n`);
          }
          JS
      - name: Request existing read-only access to pinned provider and runner sources
        id: provider-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MRN_CI_STANDALONE_REPOS_APP_ID }}
          private-key: ${{ secrets.MRN_CI_STANDALONE_REPOS_PRIVATE_KEY }}
          owner: mrnwebdesigns
          repositories: |
            mrn-mainwp-operations-api
            mrn-code-qa-runner
          permission-contents: read
      - name: Check out the accepted provider checkpoint
        uses: actions/checkout@v4
        with:
          repository: mrnwebdesigns/mrn-mainwp-operations-api
          ref: ${{ steps.sources.outputs.provider }}
          token: ${{ steps.provider-token.outputs.token }}
          path: .runtime/provider
          persist-credentials: false
      - name: Check out the canonical MCP transport
        uses: actions/checkout@v4
        with:
          repository: mrnwebdesigns/mainwp-mcp
          ref: ${{ steps.sources.outputs.transport }}
          path: .runtime/transport
          persist-credentials: false
      - name: Check out the qualified acquisition runner
        uses: actions/checkout@v4
        with:
          repository: mrnwebdesigns/mrn-code-qa-runner
          ref: ${{ steps.sources.outputs.runner }}
          token: ${{ steps.provider-token.outputs.token }}
          path: .runtime/runner
          persist-credentials: false
      - name: Check out the management context reader candidate
        uses: actions/checkout@v4
        with:
          repository: mrnwebdesigns/mrn-code-qa-runner
          ref: ${{ steps.sources.outputs.managementWorker }}
          token: ${{ steps.provider-token.outputs.token }}
          path: .runtime/management-worker
          persist-credentials: false
      - name: Install locked test dependencies and build MCP
        run: |
          npm ci --ignore-scripts --prefix tools/operations
          npm ci --ignore-scripts --prefix .runtime/transport
          npm run build --prefix .runtime/transport
      - name: Verify private capture transport size and deadlines
        env:
          MRN_GATEWAY_MCP_SOURCE: ${{ github.workspace }}/.runtime/transport
          MRN_CAPTURE_TRANSPORT_REPORT: ${{ runner.temp }}/capture-transport-report.json
        run: node tools/operations/test/runtime/check-capture-transport.mjs
      - name: Verify original dispatch readback between gateway and protected worker
        env:
          MRN_GATEWAY_MANAGEMENT_RUNNER_SOURCE: ${{ github.workspace }}/.runtime/management-worker
          MRN_GATEWAY_RUNNER_SOURCE: ${{ github.workspace }}/.runtime/runner
          MRN_GATEWAY_PROVIDER_SOURCE: ${{ github.workspace }}/.runtime/provider
        run: node tools/operations/test/runtime/check-management-worker.mjs
      - name: Exercise actual gateway, MCP and WordPress authorization
        env:
          MRN_DISPOSABLE_API_HOOK: ${{ github.workspace }}/tools/operations/test/runtime/provider-hook.sh
          MRN_DISPOSABLE_NATIVE_CHILD: '1'
          MRN_DISPOSABLE_MANAGEMENT_TEST: '1'
          MRN_DISPOSABLE_NATIVE_HOOK: ${{ github.workspace }}/tools/operations/test/runtime/native-hook.sh
          MRN_DISPOSABLE_ACCESS_HOOK: ${{ github.workspace }}/tools/operations/test/runtime/access-hook.sh
          MRN_GATEWAY_MCP_SOURCE: ${{ github.workspace }}/.runtime/transport
          MRN_GATEWAY_REPORT: ${{ runner.temp }}/gateway-provider-report.json
          MRN_GATEWAY_PROVIDER_SOURCE: ${{ github.workspace }}/.runtime/provider
          MRN_GATEWAY_RUNNER_SOURCE: ${{ github.workspace }}/.runtime/runner
          MRN_GATEWAY_NATIVE_REPORT: ${{ runner.temp }}/gateway-native-content-report.json
          MRN_GATEWAY_ACCESS_REPORT: ${{ runner.temp }}/gateway-access-report.json
          MRN_GATEWAY_MANAGEMENT_REPORT: ${{ runner.temp }}/gateway-management-report.json
        run: |
          .runtime/provider/tests/runtime/run-dashboard-api.sh
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const proof = JSON.parse(readFileSync(process.env.MRN_GATEWAY_REPORT, 'utf8'));
          assert.equal(proof.result, 'PASS');
          assert.equal(proof.passed.length, 10);
          assert.equal(proof.productionCredentials, false);
          assert.equal(proof.chatgptAcceptanceVerified, false);
          const native = JSON.parse(readFileSync(process.env.MRN_GATEWAY_NATIVE_REPORT, 'utf8'));
          assert.equal(native.result, 'PASS');
          assert.equal(native.passed.length, 8);
          assert.equal(native.scope, 'disposable-native-child-only');
          assert.equal(native.managedSites, 1);
          for (const field of ['contentWriteVerified', 'contentRollbackVerified', 'publicHtmlVerified']) assert.equal(native[field], true);
          assert.equal(native.structuredManagementReadsVerified, true);
          assert.equal(native.managementReadOnlyScopeVerified, true);
          assert.equal(native.managementWritesVerified, false);
          for (const field of ['productionCredentials', 'liveGoogleVerified', 'protectedQaVerified', 'productionQaVerified', 'remoteBackupVerified', 'chatgptAcceptanceVerified', 'codeWriteVerified']) assert.equal(native[field], false);
          const access = JSON.parse(readFileSync(process.env.MRN_GATEWAY_ACCESS_REPORT, 'utf8'));
          assert.equal(access.result, 'PASS');
          assert.equal(access.passed.length, 11);
          assert.equal(access.scope, 'disposable-native-access-only');
          for (const field of ['captureVerified', 'pendingDuringReadVerified', 'retainedCaptureRecoveryVerified', 'pendingRecoveryDenied', 'currentSitePermissionVerified', 'privateLifecycleVerified', 'measurementReadbackVerified', 'measurementSitePermissionVerified', 'pendingMeasurementsDenied', 'nodeAcquisitionVerified', 'nodeAcquisitionDenialsVerified']) assert.equal(access[field], true);
          for (const field of ['productionCredentials', 'liveGoogleVerified', 'protectedWorkerVerified', 'chatgptAcceptanceVerified', 'codeWriteVerified', 'contentWriteVerified', 'remoteBackupVerified']) assert.equal(access[field], false);
          const management = JSON.parse(readFileSync(process.env.MRN_GATEWAY_MANAGEMENT_REPORT, 'utf8'));
          assert.equal(management.result, 'PASS');
          assert.equal(management.passed.length, 6);
          assert.equal(management.scope, 'disposable-native-management-access-only');
          for (const field of ['managementCallbackVerified', 'originalIntentVerified', 'completeCaptureVerified', 'independentReadbackVerified', 'retainedMeasurementsVerified', 'currentPermissionVerified', 'pendingDuringReadVerified', 'pendingRecoveryDenied', 'childUnchangedVerified']) assert.equal(management[field], true);
          for (const field of ['productionCredentials', 'liveGoogleVerified', 'protectedWorkerVerified', 'renderedQaVerified', 'consumerBindingIssued', 'contentWriteVerified', 'remoteBackupVerified', 'chatgptAcceptanceVerified']) assert.equal(management[field], false);
          assert.ok(management.capture.measurements.readback_bytes > 65535);
          assert.ok(management.capture.measurements.readback_chunks > 1);
          assert.ok(management.callbackPosts > 0);
          assert.equal(management.draftRecordReadVerified, true);
          assert.equal(management.publishedTargetVerified, true);
          const sources = JSON.parse(readFileSync('tools/operations/test/runtime/sources.json', 'utf8'));
          for (const name of ['provider', 'transport', 'runner']) assert.equal(execFileSync('git', ['-C', `.runtime/${name}`, 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), sources[name].commit);
          for (const report of [proof, native, access, management]) assert.deepEqual(report.source, sources);
          JS
      - name: Retain redacted disposable worker failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-provider-worker-failure
          path: .runtime/provider/reports/native-job-worker-failure.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain bounded integration evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-provider-transport
          path: |
            ${{ runner.temp }}/gateway-provider-report.json
            ${{ runner.temp }}/gateway-native-content-report.json
            ${{ runner.temp }}/capture-transport-report.json
            ${{ runner.temp }}/gateway-access-report.json
            ${{ runner.temp }}/gateway-management-report.json
          if-no-files-found: error
          retention-days: 14
