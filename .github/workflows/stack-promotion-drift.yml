name: Stack promotion drift

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stack-promotion-drift
  cancel-in-progress: true

jobs:
  audit:
    name: Merged-source release inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create required-source installation token
        id: required-sources-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MRN_CI_STANDALONE_REPOS_APP_ID }}
          private-key: ${{ secrets.MRN_CI_STANDALONE_REPOS_PRIVATE_KEY }}
          owner: mrnwebdesigns
          repositories: |
            mrn-config-helper
            mrn-stack-deployment-agent
            mrn-universal-sticky-bar

      - name: Check out required standalone sources
        env:
          GH_TOKEN: ${{ steps.required-sources-token.outputs.token }}
          MRN_STANDALONE_PLUGINS_ROOT: ${{ runner.temp }}/MRN-plugins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${MRN_STANDALONE_PLUGINS_ROOT}"
          for slug in mrn-config-helper mrn-stack-deployment-agent mrn-universal-sticky-bar; do
            gh repo clone "mrnwebdesigns/${slug}" \
              "${MRN_STANDALONE_PLUGINS_ROOT}/${slug}" -- --depth 1
          done

      - name: Audit merged source against immutable lock
        id: promotion-audit
        env:
          MRN_STANDALONE_PLUGINS_ROOT: ${{ runner.temp }}/MRN-plugins
        shell: bash
        run: |
          set +e
          mkdir -p outputs
          python3 stack/scripts/qa-stack-promotion.py \
            --mode audit \
            --report outputs/stack-promotion-audit.json
          audit_status=$?
          set -e
          echo "exit_code=${audit_status}" >> "${GITHUB_OUTPUT}"
          exit "${audit_status}"

      - name: Preserve promotion inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack-promotion-audit
          path: outputs/stack-promotion-audit.json
          if-no-files-found: error
          retention-days: 30
