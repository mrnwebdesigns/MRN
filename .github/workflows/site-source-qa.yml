name: MRN site source acceptance
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      tooling_ref:
        type: string
        required: true
    secrets:
      MRN_QA_ENGINE_TOKEN:
        required: true
    outputs:
      source_sha:
        description: Exact source commit that passed the blocking QA job
        value: ${{ jobs.qa.outputs.source_sha }}
      report_sha256:
        description: Checksum of the exact successful source QA report
        value: ${{ jobs.qa.outputs.report_sha256 }}
      artifact_id:
        description: Immutable artifact ID of the source QA report
        value: ${{ jobs.qa.outputs.artifact_id }}
permissions:
  contents: read
jobs:
  qa:
    # Keep the QA image stable; `ubuntu-latest` is currently migrating to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.accepted.outputs.source_sha }}
      report_sha256: ${{ steps.accepted.outputs.report_sha256 }}
      artifact_id: ${{ steps.evidence.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: mrnwebdesigns/MRN
          ref: ${{ inputs.tooling_ref }}
          path: .mrn-deploy-tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: mrnwebdesigns/MRN-qa-engine
          ref: d0933252cbcec8b64cca464855008caaa7425de3
          path: .mrn-qa-engine
          token: ${{ secrets.MRN_QA_ENGINE_TOKEN }}
          persist-credentials: false
      - name: Isolate tooling from the exact site source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mv .mrn-qa-engine "$RUNNER_TEMP/mrn-qa-engine"
          mv .mrn-deploy-tools "$RUNNER_TEMP/mrn-deploy-tools"
          echo "MRN_QA_STACK_ROOT=$RUNNER_TEMP/mrn-deploy-tools" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's Ubuntu images include ripgrep. Avoid a package-mirror
          # dependency for the normal path; retain a bounded fallback for
          # custom runners.
          if ! command -v rg >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              if sudo apt-get update && sudo apt-get install -y ripgrep; then
                break
              fi
              if [[ "$attempt" == 3 ]]; then
                echo '::error::ripgrep is unavailable and apt setup failed after 3 attempts.'
                exit 1
              fi
              sleep $(( attempt * 5 ))
            done
          fi
          bash "$RUNNER_TEMP/mrn-deploy-tools/tools/site-deploy/install-qa-python.sh"
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress squizlabs/php_codesniffer:^3.13 wp-coding-standards/wpcs:^3.0 dealerdirect/phpcodesniffer-composer-installer:^1.1
          echo "$(composer global config bin-dir --absolute)" >> "$GITHUB_PATH"
      - name: MRN source acceptance
        shell: bash
        env:
          MRN_QA_CODE_ANALYSIS_SCOPE: all
          MRN_QA_RUN_API: static
          MRN_QA_RUN_SMOKE: never
          MRN_QA_RUN_ACCESSIBILITY: never
          MRN_QA_RUN_PERFORMANCE: never
          MRN_QA_RUN_CWV: never
          MRN_QA_RUN_PHPCBF: never
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mrn-qa-engine/bin/mrn-qa" run \
            --project-root "$GITHUB_WORKSPACE" \
            --run-api static --run-smoke never --run-accessibility never \
            --run-performance never --run-cwv never --run-phpcbf never \
            --output-file "$RUNNER_TEMP/site-source-qa.md"
      - name: Bind successful QA to this commit
        id: accepted
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -s "$RUNNER_TEMP/site-source-qa.md"
          printf 'source_sha=%s\nreport_sha256=%s\n' "$SOURCE_SHA" \
            "$(sha256sum "$RUNNER_TEMP/site-source-qa.md" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Retain source acceptance evidence
        if: always()
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: site-source-qa-${{ inputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site-source-qa.md
          if-no-files-found: warn
          retention-days: 90
