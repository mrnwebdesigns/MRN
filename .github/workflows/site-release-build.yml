name: Build immutable site release candidate
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      qa_source_sha:
        type: string
        default: ''
      qa_artifact_id:
        type: string
        default: ''
      qa_report_sha256:
        type: string
        default: ''
      qualification_required:
        type: boolean
        default: true
      source_path:
        type: string
        required: true
      stylesheet:
        type: string
        required: true
      tooling_ref:
        type: string
        required: true
    outputs:
      artifact_id:
        description: Immutable GitHub artifact ID from this build
        value: ${{ jobs.build.outputs.artifact_id }}
      artifact_sha256:
        description: SHA-256 of the release tar, independent of the uploaded sidecar
        value: ${{ jobs.build.outputs.artifact_sha256 }}
      build_attempt:
        description: Attempt that created and verified the immutable build
        value: ${{ jobs.build.outputs.build_attempt }}
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_sha256: ${{ steps.identity.outputs.artifact_sha256 }}
      build_attempt: ${{ steps.identity.outputs.build_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: mrnwebdesigns/MRN
          ref: ${{ inputs.tooling_ref }}
          path: .mrn-deploy-tools
          persist-credentials: false
      - name: Move trusted tooling outside source
        run: mv .mrn-deploy-tools "$RUNNER_TEMP/mrn-deploy-tools"
      - name: Download the exact source QA report
        if: inputs.qualification_required
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.qa_artifact_id }}
          path: ${{ runner.temp }}
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build once from the selected immutable commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_PATH: ${{ inputs.source_path }}
          SLUG: ${{ inputs.stylesheet }}
          QA_SOURCE_SHA: ${{ inputs.qa_source_sha }}
          QUALIFICATION_REQUIRED: ${{ inputs.qualification_required }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [[ "$QUALIFICATION_REQUIRED" == true ]]; then
            [[ "$QA_SOURCE_SHA" == "$SOURCE_SHA" ]]
          else
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -z "$QA_SOURCE_SHA" ]]
          fi
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$SOURCE_SHA" == "$GITHUB_SHA" && "$QA_SOURCE_SHA" == "$SOURCE_SHA" ]]
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            [[ "$QA_SOURCE_SHA" == "$SOURCE_SHA" ]]
          fi
          npm ci --ignore-scripts --prefix "$RUNNER_TEMP/mrn-deploy-tools/tools/site-deploy"
          python3 "$RUNNER_TEMP/mrn-deploy-tools/tools/site-deploy/build_release.py" \
            --sha "$SOURCE_SHA" --source "$SOURCE_PATH" --slug "$SLUG" \
            --output "$RUNNER_TEMP/site-release.tar"
      - name: Verify build and publish its checksum
        id: identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_PATH: ${{ inputs.source_path }}
          SLUG: ${{ inputs.stylesheet }}
          TOOLING_REF: ${{ inputs.tooling_ref }}
          QA_ARTIFACT_ID: ${{ inputs.qa_artifact_id }}
          QA_REPORT_SHA256: ${{ inputs.qa_report_sha256 }}
          QUALIFICATION_REQUIRED: ${{ inputs.qualification_required }}
        run: |
          set -euo pipefail
          export ARTIFACT_SHA256="$(sha256sum "$RUNNER_TEMP/site-release.tar" | cut -d ' ' -f 1)"
          export BUILD_ATTEMPT="$GITHUB_RUN_ATTEMPT"
          python3 "$RUNNER_TEMP/mrn-deploy-tools/tools/site-deploy/verify_release.py" \
            --archive "$RUNNER_TEMP/site-release.tar" --sha256 "$ARTIFACT_SHA256" \
            --source-sha "$SOURCE_SHA" --source-path "$SOURCE_PATH" --slug "$SLUG" \
            --receipt "$RUNNER_TEMP/site-artifact-verification.json"
          if [[ "$QUALIFICATION_REQUIRED" == true ]]; then
            python3 "$RUNNER_TEMP/mrn-deploy-tools/tools/site-deploy/release_qualification.py" write \
              "$RUNNER_TEMP/site-release-qualification.json"
          fi
          printf 'artifact_sha256=%s\nbuild_attempt=%s\n' "$ARTIFACT_SHA256" "$BUILD_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: site-release-${{ inputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/site-release.tar
            ${{ runner.temp }}/site-release.json
            ${{ runner.temp }}/site-artifact-verification.json
            ${{ runner.temp }}/site-release-qualification.json
            ${{ runner.temp }}/site-source-qa.md
          if-no-files-found: error
          retention-days: 90
