name: MRN QA

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mrn-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-gate:
    name: Code gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MRN_QA_CODE_ANALYSIS_SCOPE: changed
      MRN_QA_RUN_SMOKE: never
      MRN_QA_RUN_ACCESSIBILITY: never
      MRN_QA_RUN_PERFORMANCE: never
      MRN_QA_RUN_API: static
      MRN_QA_PLAYWRIGHT_PROVIDER: engine
    steps:
      - name: Check out MRN
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MRN PHP QA dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade semgrep
          semgrep_bin="$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))')/semgrep"
          "$semgrep_bin" --version
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/usr/bin/env sh\nexec "%s" "$@"\n' "$semgrep_bin" > "$RUNNER_TEMP/bin/semgrep"
          chmod +x "$RUNNER_TEMP/bin/semgrep"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check out the pinned QA engine
        uses: actions/checkout@v4
        with:
          repository: mrnwebdesigns/MRN-qa-engine
          ref: e12f203079de129cd7ff5579cdac9f7fb5583939
          path: ${{ runner.temp }}/mrn-qa-engine
          token: ${{ secrets.MRN_QA_ENGINE_TOKEN }}
          persist-credentials: false

      - name: Run MRN static QA gate
        run: |
          mkdir -p reports
          export MRN_QA_STACK_ROOT="$GITHUB_WORKSPACE"
          export MRN_QA_CHANGED_FILES="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          "$RUNNER_TEMP/mrn-qa-engine/bin/mrn-qa" run \
            --project-root "$GITHUB_WORKSPACE" \
            --output-file "$GITHUB_WORKSPACE/reports/mrn-qa-ci.md"

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrn-qa-report
          path: reports/mrn-qa-ci.md
          if-no-files-found: warn
