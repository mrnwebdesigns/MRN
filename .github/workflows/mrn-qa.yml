name: MRN QA

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mrn-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-gate:
    name: Code gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MRN_QA_STACK_ROOT: ${{ github.workspace }}
      MRN_QA_CODE_ANALYSIS_SCOPE: changed
      MRN_QA_RUN_SMOKE: never
      MRN_QA_RUN_ACCESSIBILITY: never
      MRN_QA_RUN_PERFORMANCE: never
      MRN_QA_RUN_API: static
      MRN_QA_PLAYWRIGHT_PROVIDER: engine
    steps:
      - name: Check out MRN
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MRN PHP QA dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Semgrep
        run: |
          python -m pip install semgrep
          python -c "import semgrep"

      - name: Check out the pinned QA engine
        uses: actions/checkout@v4
        with:
          repository: mrnwebdesigns/MRN-qa-engine
          ref: 63016a3aedb7ae6a83054c1f542744b3b7b9e94a
          path: .mrn-qa-engine
          token: ${{ secrets.MRN_QA_ENGINE_TOKEN }}
          persist-credentials: false

      - name: Determine changed files for QA
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_file_list="$RUNNER_TEMP/mrn-qa-changed-files"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" > "$changed_file_list"
          else
            git diff --name-only HEAD^ HEAD > "$changed_file_list"
          fi

          delimiter="MRN_QA_CHANGED_FILES_$$"
          {
            echo "MRN_QA_CHANGED_FILES<<$delimiter"
            cat "$changed_file_list"
            echo "$delimiter"
          } >> "$GITHUB_ENV"

      - name: Create standalone repository installation token
        id: standalone-repos-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MRN_CI_STANDALONE_REPOS_APP_ID }}
          private-key: ${{ secrets.MRN_CI_STANDALONE_REPOS_PRIVATE_KEY }}
          owner: mrnwebdesigns
          repositories: |
            background-video-popout-disabler
            mrn-acf-character-count
            mrn-acf-focal-point
            mrn-ai-assist
            mrn-announcements
            mrn-comment-management
            mrn-config-helper
            mrn-cookie-consent
            mrn-editor-tools
            mrn-fontawesome-profile-manager
            mrn-gtm-injector
            mrn-sendgrid-provisioning
            mrn-seo-helper
            mrn-universal-sticky-bar

      # The app token is short-lived and limited to the standalone repositories.
      - name: Check out standalone plugin repos
        env:
          GH_TOKEN: ${{ steps.standalone-repos-token.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/../MRN-plugins"
          repos="background-video-popout-disabler mrn-acf-character-count mrn-acf-focal-point mrn-ai-assist mrn-announcements mrn-comment-management mrn-config-helper mrn-cookie-consent mrn-editor-tools mrn-fontawesome-profile-manager mrn-gtm-injector mrn-sendgrid-provisioning mrn-seo-helper mrn-universal-sticky-bar"
          for slug in $repos; do
            gh repo clone "mrnwebdesigns/${slug}" "$GITHUB_WORKSPACE/../MRN-plugins/${slug}" -- --depth 1
          done

          # plugins/<slug> itself is gitignored (untracked), so a fresh CI
          # checkout has nothing there at all -- create the same relative
          # symlinks a local dev machine has after checking out MRN and
          # MRN-plugins as siblings.
          cd "$GITHUB_WORKSPACE/plugins"
          for slug in $repos; do
            [ -e "$slug" ] && continue
            if [ "$slug" = "mrn-ai-assist" ]; then
              ln -s "../../MRN-plugins/mrn-ai-assist/wordpress-plugin" "$slug"
            else
              ln -s "../../MRN-plugins/${slug}" "$slug"
            fi
          done

      - name: Run MRN static QA gate
        run: |
          mkdir -p reports
          "$GITHUB_WORKSPACE/.mrn-qa-engine/bin/mrn-qa" run \
            --project-root "$GITHUB_WORKSPACE" \
            --output-file "$GITHUB_WORKSPACE/reports/mrn-qa-ci.md"

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrn-qa-report
          path: reports/mrn-qa-ci.md
          if-no-files-found: warn
