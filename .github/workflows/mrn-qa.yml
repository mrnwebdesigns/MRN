name: MRN QA

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mrn-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-gate:
    name: Code gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MRN_QA_STACK_ROOT: ${{ github.workspace }}
      MRN_QA_CODE_ANALYSIS_SCOPE: all
      MRN_QA_RUN_SMOKE: never
      MRN_QA_RUN_ACCESSIBILITY: never
      MRN_QA_RUN_PERFORMANCE: never
      MRN_QA_RUN_API: static
      MRN_QA_PLAYWRIGHT_PROVIDER: engine
    steps:
      - name: Check out MRN
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MRN PHP QA dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Semgrep
        run: |
          python -m pip install semgrep
          python -c "import semgrep"

      - name: Check out the pinned QA engine
        uses: actions/checkout@v4
        with:
          repository: mrnwebdesigns/MRN-qa-engine
          ref: 63016a3aedb7ae6a83054c1f542744b3b7b9e94a
          path: .mrn-qa-engine
          token: ${{ secrets.MRN_QA_ENGINE_TOKEN }}
          persist-credentials: false

      # plugins/<slug> in the MRN checkout are gitignored local symlinks
      # (../../MRN-plugins/<slug>) into these standalone repos -- see
      # ".gitignore" and "stack/RELEASE_VERSIONING_STRATEGY.md". Cloning
      # each one to the same sibling-relative location the symlinks expect
      # makes the existing symlinks resolve in CI exactly like they do on a
      # dev machine that checked out MRN and MRN-plugins as siblings, with
      # no changes needed to the QA engine itself.
      - name: Check out standalone plugin repos
        env:
          GH_TOKEN: ${{ secrets.MRN_QA_ENGINE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/../MRN-plugins"
          repos="background-video-popout-disabler mrn-acf-character-count mrn-acf-focal-point mrn-ai-assist mrn-announcements mrn-comment-management mrn-config-helper mrn-cookie-consent mrn-editor-tools mrn-fontawesome-profile-manager mrn-gtm-injector mrn-sendgrid-provisioning mrn-seo-helper mrn-universal-sticky-bar"
          for slug in $repos; do
            gh repo clone "mrnwebdesigns/${slug}" "$GITHUB_WORKSPACE/../MRN-plugins/${slug}" -- --depth 1
          done

      - name: Run MRN static QA gate
        run: |
          mkdir -p reports
          "$GITHUB_WORKSPACE/.mrn-qa-engine/bin/mrn-qa" run \
            --project-root "$GITHUB_WORKSPACE" \
            --output-file "$GITHUB_WORKSPACE/reports/mrn-qa-ci.md"

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrn-qa-report
          path: reports/mrn-qa-ci.md
          if-no-files-found: warn
