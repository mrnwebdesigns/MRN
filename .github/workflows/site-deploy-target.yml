name: MRN site deployment target

on:
  workflow_call:
    outputs:
      promotion_evidence_id:
        value: ${{ jobs.deploy.outputs.promotion_evidence_id }}
    inputs:
      local_qa_acceptance:
        type: string
        default: ''
      qualify_dev:
        type: boolean
        default: false
      qualify_doster_live:
        type: boolean
        default: false
      require_promotion_qa:
        type: boolean
        default: false
      promotion_same_run:
        type: boolean
        default: false
      promotion_evidence_id:
        type: string
        default: ''
      target:
        type: string
        required: true
      mode:
        type: string
        default: preflight
      source_path:
        type: string
        required: true
      stylesheet:
        type: string
        required: true
      tooling_ref:
        type: string
        required: true
      source_sha:
        type: string
        default: ''
      qa_source_sha:
        type: string
        default: ''
      qa_artifact_id:
        type: string
        default: ''
      qa_report_sha256:
        type: string
        default: ''
      build_attempt:
        type: string
        required: true
      source_branch:
        type: string
        default: main
      auto_dev_branch:
        type: string
        default: main
      auto_dev_after:
        type: string
        default: ''
      release_intent:
        type: string
        default: '{}'
      release_requests_after:
        type: string
        default: ''
      live_enabled:
        type: boolean
        default: true
      dev_main_enabled:
        type: boolean
        default: true
      artifact_id:
        type: string
        required: true
      artifact_sha256:
        type: string
        required: true
    secrets:
      MRN_QA_ENGINE_TOKEN:
        required: false
      DEPLOY_SSH_PRIVATE_KEY:
        required: false
      DEPLOY_SSH_KNOWN_HOSTS:
        required: false
      DEV_SSH_PRIVATE_KEY:
        required: false
      DEV_SSH_KNOWN_HOSTS:
        required: false
      DEPLOY_KINSTA_API_TOKEN:
        required: false
      DEPLOY_WPENGINE_API_USERNAME:
        required: false
      DEPLOY_WPENGINE_API_PASSWORD:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Site target (${{ inputs.target }})
    if: github.ref == 'refs/heads/main'
    # Playwright 1.60 is qualified on Ubuntu 24.04. Keep the deployment runner
    # explicit so a moving GitHub "latest" label cannot bypass browser QA.
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.local_qa_acceptance != '' && 65 || 40 }}
    outputs:
      promotion_evidence_id: ${{ steps.promotion-evidence.outputs.artifact-id }}
    environment:
      name: ${{ inputs.target }}
      deployment: ${{ inputs.mode != 'preflight' }}
    concurrency:
      group: site-code-${{ github.repository }}-${{ inputs.target }}
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_HOST_PROVIDER: ${{ vars.DEPLOY_HOST_PROVIDER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
      DEPLOY_TEMPLATE: ${{ vars.DEPLOY_TEMPLATE }}
      DEPLOY_STATE_DIR: ${{ vars.DEPLOY_STATE_DIR }}
      DEPLOY_BACKUP_PROVIDER: ${{ vars.DEPLOY_BACKUP_PROVIDER }}
      DEPLOY_WPENGINE_INSTALL_ID: ${{ vars.DEPLOY_WPENGINE_INSTALL_ID }}
      DEPLOY_KINSTA_SITE_ID: ${{ vars.DEPLOY_KINSTA_SITE_ID }}
      DEPLOY_KINSTA_ENVIRONMENT_ID: ${{ vars.DEPLOY_KINSTA_ENVIRONMENT_ID }}
      DEPLOY_KINSTA_TRANSACTION_BACKUP_APPROVED: ${{ vars.DEPLOY_KINSTA_TRANSACTION_BACKUP_APPROVED }}
      DEPLOY_KINSTA_MANUAL_BACKUP_APPROVAL: ${{ vars.DEPLOY_KINSTA_MANUAL_BACKUP_APPROVAL }}
      DEPLOY_TRANSPORT: ${{ vars.DEPLOY_TRANSPORT }}
      DEPLOY_BASELINE_TREE: ${{ vars.DEPLOY_BASELINE_TREE }}
      DEPLOY_READY: ${{ vars.DEPLOY_READY }}
      DEPLOY_ENROLLMENT_SOURCE_SHA: ${{ vars.DEPLOY_ENROLLMENT_SOURCE_SHA }}
      DEPLOY_ENROLLMENT_PRIOR_RELEASE: ${{ vars.DEPLOY_ENROLLMENT_PRIOR_RELEASE }}
      LOCAL_QA_ACCEPTANCE: ${{ inputs.local_qa_acceptance }}
      QUALIFY_DEV: ${{ inputs.qualify_dev }}
      QUALIFY_DOSTER_LIVE: ${{ inputs.qualify_doster_live }}
      DEPLOY_VERIFY_PAGES: ${{ vars.DEPLOY_VERIFY_PAGES }}
      MODE: ${{ inputs.mode }}
      TARGET: ${{ inputs.target }}
      SOURCE_PATH: ${{ inputs.source_path }}
      STYLESHEET: ${{ inputs.stylesheet }}
      TOOLING_REF: ${{ inputs.tooling_ref }}
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      RELEASE_INTENT: ${{ inputs.release_intent }}
      RELEASE_REQUESTS_AFTER: ${{ inputs.release_requests_after }}
      LIVE_ENABLED: ${{ inputs.live_enabled }}
      DEV_MAIN_ENABLED: ${{ inputs.dev_main_enabled }}
      AUTO_DEV_BRANCH: ${{ inputs.auto_dev_branch }}
      AUTO_DEV_AFTER: ${{ inputs.auto_dev_after }}
      MRN_SOURCE_QA_SHA: ${{ inputs.qa_source_sha }}
      QA_ARTIFACT_ID: ${{ inputs.qa_artifact_id }}
      QA_REPORT_SHA256: ${{ inputs.qa_report_sha256 }}
      BUILD_ATTEMPT: ${{ inputs.build_attempt }}
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
      PROMOTION_SAME_RUN: ${{ inputs.promotion_same_run }}
      PROMOTION_EVIDENCE_ID: ${{ inputs.promotion_evidence_id }}
    steps:
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_run || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$MODE" == preflight || "$MODE" == deploy || "$MODE" == hotfix ]]
          [[ "$TARGET" == dev || "$TARGET" == staging || "$TARGET" == live ]]
          [[ "$TOOLING_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$TARGET/$MODE" != live/deploy ]]; then
            [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          fi
          [[ "$TARGET" == dev || "$SOURCE_BRANCH" == main ]]
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$TARGET" == dev && "$MODE" == deploy && "$SOURCE_BRANCH" == main ]]
            [[ "$SOURCE_SHA" == "$GITHUB_SHA" && "$MRN_SOURCE_QA_SHA" == "$SOURCE_SHA" ]]
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            [[ "$MODE" == deploy ]]
            if [[ "$RELEASE_INTENT" == '{}' ]]; then
              [[ "$TARGET" == dev && "$SOURCE_BRANCH" == "$AUTO_DEV_BRANCH" ]]
            fi
          fi
          if [[ "$MODE" == deploy && "$TARGET" != live ]]; then
            [[ "$MRN_SOURCE_QA_SHA" == "$SOURCE_SHA" ]]
          fi
          if [[ "$MODE" == hotfix ]]; then
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$TARGET" == live && "$QUALIFY_DEV" != true && "$QUALIFY_DOSTER_LIVE" != true && -z "$LOCAL_QA_ACCEPTANCE" ]]
          fi
          if [[ "${QUALIFY_DOSTER_LIVE:-false}" == true ]]; then
            [[ "$GITHUB_REPOSITORY" == mrnwebdesigns/doster-and-brown-child-theme && "$GITHUB_EVENT_NAME" == workflow_dispatch && "$TARGET" == live && "$SOURCE_BRANCH" == main && "$QUALIFY_DEV" != true ]]
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source and Live eligibility
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [[ "$TARGET" == live ]]; then
            test "$SOURCE_BRANCH" = main
            git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          fi
      - name: Check out pinned deployment tooling
        uses: actions/checkout@v4
        with:
          repository: mrnwebdesigns/MRN
          ref: ${{ inputs.tooling_ref }}
          path: .mrn-deploy-tools
          persist-credentials: false
      - name: Move tooling outside site source
        run: |
          mv .mrn-deploy-tools "$RUNNER_TEMP/mrn-deploy-tools"
          echo "MRN_QA_STACK_ROOT=$RUNNER_TEMP/mrn-deploy-tools" >> "$GITHUB_ENV"
      - name: Require a safe deployment retry
        if: inputs.mode != 'preflight'
        run: |
          python3 - "$RUNNER_TEMP/mrn-deploy-tools/tools/site-deploy" <<'PY'
          import os, sys
          sys.path.insert(0, sys.argv[1])
          from deployment_request import require_safe_retry
          require_safe_retry(os.environ, os.environ['TARGET'])
          PY
      - name: Resolve exact pre-production promotion evidence
        id: promotion-source
        if: inputs.target == 'live' && inputs.mode == 'deploy'
        run: python3 "$RUNNER_TEMP/mrn-deploy-tools/tools/site-deploy/live_promotion.py" select
      - name: Download pre-production promotion evidence
        if: inputs.target == 'live' && inputs.mode == 'deploy'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.promotion-source.outputs.evidence_id }}
          run-id: ${{ steps.promotion-source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/site-promotion
          merge-multiple: true
      - name: Require passing QA from the exact pre-production release
        id: promotion
        if: inputs.target == 'live' && inputs.mode == 'deploy'
        env:
          PROMOTION_RUN_ID: ${{ steps.promotion-source.outputs.run_id }}
          PROMOTION_EVIDENCE_ID_SELECTED: ${{ steps.promotion-source.outputs.evidence_id }}
          SLUG: ${{ inputs.stylesheet }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/mrn-deploy-tools/tools/site-deploy/live_promotion.py" verify \
            --receipt "$RUNNER_TEMP/site-promotion/site-promotion.json" --run-id "$PROMOTION_RUN_ID"
          printf 'Pre-production promotion evidence artifact: %s. Producer run: %s.\n' \
            "$PROMOTION_EVIDENCE_ID_SELECTED" "$PROMOTION_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Bind the original archive from the verified promotion
        if: inputs.target == 'live' && inputs.mode == 'deploy'
        env:
          PROMOTED_ARCHIVE_ID: ${{ steps.promotion.outputs.archive_id }}
          PROMOTED_ARCHIVE_SHA256: ${{ steps.promotion.outputs.archive_sha256 }}
          PROMOTED_BUILD_ATTEMPT: ${{ steps.promotion.outputs.build_attempt }}
          PROMOTED_QA_ARTIFACT_ID: ${{ steps.promotion.outputs.qa_artifact_id }}
          PROMOTED_QA_REPORT_SHA256: ${{ steps.promotion.outputs.qa_report_sha256 }}
        run: |
          set -euo pipefail
          if [[ "$PROMOTION_SAME_RUN" == true ]]; then
            [[ "$ARTIFACT_ID" == "$PROMOTED_ARCHIVE_ID" && "$ARTIFACT_SHA256" == "$PROMOTED_ARCHIVE_SHA256" ]]
          fi
          {
            printf 'ARTIFACT_SHA256=%s\nBUILD_ATTEMPT=%s\n' "$PROMOTED_ARCHIVE_SHA256" "$PROMOTED_BUILD_ATTEMPT"
            printf 'QA_ARTIFACT_ID=%s\nQA_REPORT_SHA256=%s\nMRN_SOURCE_QA_SHA=%s\n' \
              "$PROMOTED_QA_ARTIFACT_ID" "$PROMOTED_QA_REPORT_SHA256" "$SOURCE_SHA"
          } >> "$GITHUB_ENV"
      - name: Download the exact immutable release artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.promotion.outputs.archive_id || inputs.artifact_id }}
          run-id: ${{ steps.promotion.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/site-release
          merge-multiple: true
      - name: Verify artifact before configuring site access
        env:
          SLUG: ${{ inputs.stylesheet }}
          PROMOTED_RUN_ID: ${{ steps.promotion.outputs.run_id }}
          PROMOTED_RUN_ATTEMPT: ${{ steps.promotion.outputs.run_attempt }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/mrn-deploy-tools/tools/site-deploy/verify_release.py" \
            --archive "$RUNNER_TEMP/site-release/site-release.tar" --sha256 "$ARTIFACT_SHA256" \
            --source-sha "$SOURCE_SHA" --source-path "$SOURCE_PATH" --slug "$STYLESHEET" \
            --receipt "$RUNNER_TEMP/site-artifact-verification.json"
          if [[ "$MODE" == deploy ]]; then
            GITHUB_RUN_ID="${PROMOTED_RUN_ID:-$GITHUB_RUN_ID}" \
            GITHUB_RUN_ATTEMPT="${PROMOTED_RUN_ATTEMPT:-$GITHUB_RUN_ATTEMPT}" \
              python3 "$RUNNER_TEMP/mrn-deploy-tools/tools/site-deploy/release_qualification.py" verify \
              "$RUNNER_TEMP/site-release/site-release-qualification.json"
          fi
      - name: Record emergency approval for this exact Live artifact
        if: inputs.mode == 'hotfix'
        run: |
          python3 - "$RUNNER_TEMP/mrn-deploy-tools/tools/site-deploy" <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, sys.argv[1])
          from deployment_request import github_order

          env = os.environ
          order = github_order(env, env['SOURCE_SHA'], env['TARGET'], 'deploy')
          receipt = {
              'mode': 'hotfix', 'target': 'live', 'deployment_order': order,
              'artifact_id': env['ARTIFACT_ID'], 'artifact_sha256': env['ARTIFACT_SHA256'],
          }
          (pathlib.Path(env['RUNNER_TEMP']) / 'site-hotfix-approval.json').write_text(json.dumps(receipt, indent=2) + '\n')
          with open(env['GITHUB_STEP_SUMMARY'], 'a') as summary:
              print(f"Emergency Live hotfix confirmed by {order['hotfix']['actor']} for `{env['SOURCE_SHA']}`.", file=summary)
              print('Dev/staging acceptance and the full release QA suite were waived for this dispatch.', file=summary)
          PY
      - name: Retrieve the exact original Doster qualification artifact
        if: inputs.qualify_doster_live
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12272493310'
          run-id: '39438246725'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/doster-original-release
          merge-multiple: true
      - name: Verify the reviewed Doster cutover before configuring site access
        if: inputs.qualify_doster_live
        run: |
          python3 "$RUNNER_TEMP/mrn-deploy-tools/tools/site-deploy/doster_live_cutover.py" \
            --archive "$RUNNER_TEMP/doster-original-release/site-release.tar" \
            --output "$RUNNER_TEMP/doster-live-promotion.json"
      - name: Validate approved local release qualification
        if: inputs.local_qa_acceptance != ''
        run: |
          python3 "$RUNNER_TEMP/mrn-deploy-tools/tools/site-deploy/freedomhouse_acceptance.py" qualify \
            --receipt "$RUNNER_TEMP/site-local-qualification.json"
      - name: Check out pinned QA engine
        if: inputs.mode == 'deploy'
        uses: actions/checkout@v4
        with:
          repository: mrnwebdesigns/MRN-qa-engine
          ref: d0933252cbcec8b64cca464855008caaa7425de3
          path: .mrn-qa-engine
          token: ${{ secrets.MRN_QA_ENGINE_TOKEN }}
          persist-credentials: false
      - name: Move QA engine outside site source
        if: inputs.mode == 'deploy'
        run: mv .mrn-qa-engine "$RUNNER_TEMP/mrn-qa-engine"
      - uses: actions/setup-node@v4
        if: inputs.mode == 'deploy'
        with:
          node-version: '22'
      - name: Install browser QA dependencies
        if: inputs.mode == 'deploy'
        run: |
          npm ci --prefix "$RUNNER_TEMP/mrn-qa-engine"
          # GitHub-hosted Ubuntu runners already include Chromium's system
          # libraries.  Avoid apt-based `--with-deps` here: it is both
          # unnecessary and an external Ubuntu-package failure point during a
          # production release.
          "$RUNNER_TEMP/mrn-qa-engine/node_modules/.bin/playwright" install chromium
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - uses: actions/setup-python@v5
        if: inputs.mode == 'deploy'
        with:
          python-version: '3.11'
      - name: Install source QA dependencies
        if: inputs.mode == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/mrn-deploy-tools/tools/site-deploy/install-qa-python.sh"
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress squizlabs/php_codesniffer:^3.13 wp-coding-standards/wpcs:^3.0 dealerdirect/phpcodesniffer-composer-installer:^1.1
          composer global config bin-dir --absolute >> "$GITHUB_PATH"
      - name: Configure pinned SSH identity
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || (inputs.target == 'dev' && secrets.DEV_SSH_PRIVATE_KEY) || '' }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS || (inputs.target == 'dev' && secrets.DEV_SSH_KNOWN_HOSTS) || '' }}
        run: |
          set -euo pipefail
          if [[ ( "$DEPLOY_BACKUP_PROVIDER" != kinsta || -n "$DEPLOY_KINSTA_MANUAL_BACKUP_APPROVAL" ) && -z "$SSH_KEY" ]]; then
            echo '::error::Missing deployment SSH private-key secret for this environment.'
            exit 1
          fi
          if [[ -z "$KNOWN_HOSTS" ]]; then
            echo '::error::Missing pinned SSH known-hosts secret for this environment.'
            exit 1
          fi
          umask 077
          if [[ "$DEPLOY_BACKUP_PROVIDER" == kinsta && -z "$DEPLOY_KINSTA_MANUAL_BACKUP_APPROVAL" ]]; then
            printf 'DEPLOY_KEY_FILE=native-kinsta\n' >> "$GITHUB_ENV"
          else
            printf 'DEPLOY_KEY_FILE=%s/site-deploy.key\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          fi
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/site-deploy.key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/site-deploy.known_hosts"
          if [[ "$DEPLOY_HOST_PROVIDER" == wpengine ]]; then
            [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
            mkdir -p "$RUNNER_TEMP/mrn-wpe-control" "$HOME/.ssh"
            chmod 700 "$RUNNER_TEMP/mrn-wpe-control" "$HOME/.ssh"
            cat >> "$HOME/.ssh/config" <<EOF
          Host $DEPLOY_HOST
            ControlMaster auto
            ControlPersist 60
            ControlPath $RUNNER_TEMP/mrn-wpe-control/%C
          EOF
            chmod 600 "$HOME/.ssh/config"
          fi
          if [[ "$DEPLOY_BACKUP_PROVIDER" != kinsta || -n "$DEPLOY_KINSTA_MANUAL_BACKUP_APPROVAL" ]]; then
            if ! ssh-keygen -y -P '' -f "$RUNNER_TEMP/site-deploy.key" >/dev/null 2>&1; then
              echo '::error::Deployment SSH secret is not a valid noninteractive private key.'
              exit 1
            fi
          fi
      - name: Install native Kinsta SSH transport
        if: vars.DEPLOY_BACKUP_PROVIDER == 'kinsta' && vars.DEPLOY_KINSTA_MANUAL_BACKUP_APPROVAL == ''
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Preflight or deploy exact child-theme payload
        id: activation
        shell: bash
        env:
          DEPLOY_KNOWN_HOSTS_FILE: ${{ runner.temp }}/site-deploy.known_hosts
          DEPLOY_KINSTA_API_TOKEN: ${{ secrets.DEPLOY_KINSTA_API_TOKEN }}
          DEPLOY_WPENGINE_API_USERNAME: ${{ secrets.DEPLOY_WPENGINE_API_USERNAME }}
          DEPLOY_WPENGINE_API_PASSWORD: ${{ secrets.DEPLOY_WPENGINE_API_PASSWORD }}
        run: |
          set -euo pipefail
          promotion_args=()
          deploy_mode="$MODE"
          if [[ "$MODE" == hotfix ]]; then
            deploy_mode=deploy
          fi
          if [[ "${QUALIFY_DOSTER_LIVE:-false}" == true ]]; then
            promotion_args=(--promote-kinsta-staging-manifest "$RUNNER_TEMP/doster-live-promotion.json" --promoted-source-artifact "$RUNNER_TEMP/doster-original-release/site-release.tar")
          fi
          python3 "$RUNNER_TEMP/mrn-deploy-tools/tools/site-deploy/deploy.py" \
            --mode "$deploy_mode" --environment "$TARGET" --sha "$SOURCE_SHA" \
            --source "$SOURCE_PATH" --slug "$STYLESHEET" \
            --artifact "$RUNNER_TEMP/site-release/site-release.tar" --artifact-sha256 "$ARTIFACT_SHA256" \
            --receipt "$RUNNER_TEMP/site-deployment.json" \
            --write-state "$RUNNER_TEMP/site-write-state.json" "${promotion_args[@]}"
      - name: Verify browser-loaded assets and responsive layout contracts
        id: browser
        if: inputs.mode == 'deploy' && inputs.local_qa_acceptance == ''
        env:
          MRN_QA_ENGINE_ROOT: ${{ runner.temp }}/mrn-qa-engine
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          with tarfile.open(root / 'site-release/site-release.tar') as archive:
              (root / 'site-assets.json').write_bytes(archive.extractfile('theme/mrn-assets.json').read())
          PY
          node "$RUNNER_TEMP/mrn-deploy-tools/tools/site-deploy/verify_browser_assets.mjs" \
            "$RUNNER_TEMP/site-assets.json" "$RUNNER_TEMP/site-deployment.json" "$RUNNER_TEMP/site-browser"
          if [[ -f qa/layout-contracts.json ]]; then
            "$RUNNER_TEMP/mrn-qa-engine/tools/run-layout-contracts.sh" \
              --base-url "$DEPLOY_URL" --contract qa/layout-contracts.json --output-dir "$RUNNER_TEMP/site-layout"
          fi
      - name: Restore the prior release if browser acceptance fails
        if: failure() && inputs.mode == 'deploy' && steps.activation.outcome == 'success' && steps.browser.outcome == 'failure'
        env:
          DEPLOY_KINSTA_API_TOKEN: ${{ secrets.DEPLOY_KINSTA_API_TOKEN }}
          DEPLOY_WPENGINE_API_USERNAME: ${{ secrets.DEPLOY_WPENGINE_API_USERNAME }}
          DEPLOY_WPENGINE_API_PASSWORD: ${{ secrets.DEPLOY_WPENGINE_API_PASSWORD }}
          DEPLOY_KNOWN_HOSTS_FILE: ${{ runner.temp }}/site-deploy.known_hosts
        run: |
          python3 "$RUNNER_TEMP/mrn-deploy-tools/tools/site-deploy/atomic_runner.py" \
            --rollback-receipt "$RUNNER_TEMP/site-deployment.json" --receipt "$RUNNER_TEMP/site-rollback.json"
      - name: Run runtime QA
        id: runtime
        if: success() && inputs.mode == 'deploy'
        run: |
          set -euo pipefail
          performance=never
          cwv=never
          if [[ "$TARGET" != dev ]]; then performance=always; cwv=auto; fi
          "$RUNNER_TEMP/mrn-qa-engine/bin/mrn-qa" run --mode release --smoke-strict 1 \
            --project-root "$GITHUB_WORKSPACE" --site-url "$DEPLOY_URL" --scope site-only \
            --run-api always --run-smoke always --run-accessibility always --run-performance "$performance" --run-cwv "$cwv" \
            --run-phpcbf never --output-file "$RUNNER_TEMP/site-runtime-qa.md"
      - name: Smoke-check the activated Live hotfix
        id: hotfix-smoke
        if: success() && inputs.mode == 'hotfix'
        run: |
          python3 - "$RUNNER_TEMP/mrn-deploy-tools/tools/site-deploy" <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, sys.argv[1])
          from deploy import http_check

          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          url = os.environ['DEPLOY_URL'].rstrip('/')
          http_check(url + '/')
          http_check(url + '/wp-json/', rest=True)
          result = {'outcome': 'success', 'source_sha': os.environ['SOURCE_SHA'],
                    'artifact_sha256': os.environ['ARTIFACT_SHA256'], 'checks': ['homepage', 'wp-json']}
          (root / 'site-hotfix-smoke.json').write_text(json.dumps(result, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              print('Live hotfix smoke passed for the homepage and WordPress REST discovery.', file=summary)
          PY
      - name: Restore the prior release if strict runtime acceptance fails
        if: >-
          failure() && steps.activation.outcome == 'success' &&
          ((inputs.mode == 'deploy' && (inputs.target != 'dev' || inputs.qualify_dev || inputs.require_promotion_qa) &&
           steps.runtime.outcome == 'failure') ||
           (inputs.mode == 'hotfix' && steps.hotfix-smoke.outcome == 'failure'))
        env:
          DEPLOY_KINSTA_API_TOKEN: ${{ secrets.DEPLOY_KINSTA_API_TOKEN }}
          DEPLOY_WPENGINE_API_USERNAME: ${{ secrets.DEPLOY_WPENGINE_API_USERNAME }}
          DEPLOY_WPENGINE_API_PASSWORD: ${{ secrets.DEPLOY_WPENGINE_API_PASSWORD }}
          DEPLOY_KNOWN_HOSTS_FILE: ${{ runner.temp }}/site-deploy.known_hosts
        run: |
          python3 "$RUNNER_TEMP/mrn-deploy-tools/tools/site-deploy/atomic_runner.py" \
            --rollback-receipt "$RUNNER_TEMP/site-deployment.json" --receipt "$RUNNER_TEMP/site-rollback.json"
      - name: Report deployment and runtime acceptance
        if: always() && inputs.mode == 'deploy' && steps.activation.outcome == 'success'
        env:
          QA_RESULT: ${{ steps.runtime.outcome }}
          LOCAL_RESULT: runtime-qa
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          result = {key: os.environ[name] for key, name in (
              ('outcome', 'QA_RESULT'), ('source_sha', 'SOURCE_SHA'),
              ('environment', 'TARGET'), ('url', 'DEPLOY_URL'))}
          if os.environ.get('LOCAL_QA_ACCEPTANCE'):
              result['local_qa_and_live_readback'] = os.environ['LOCAL_RESULT']
              result['acceptance_mode'] = 'local-qualified-with-live-readback'
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'site-runtime-result.json').write_text(json.dumps(result) + '\n')
          PY
          {
            echo "Deployment target: $TARGET."
            echo "Hosted runtime QA: $QA_RESULT. Review the retained report before approving any release."
            echo "Local qualification plus Live readback: $LOCAL_RESULT."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$QA_RESULT" != success && "$LOCAL_RESULT" != success ]]; then
            echo '::warning::Runtime QA has findings or did not complete. This is not release approval.'
          fi
      - name: Record passing pre-production promotion evidence
        id: promotion-record
        if: >-
          success() && inputs.target != 'live' && inputs.mode == 'deploy' && inputs.source_branch == 'main' &&
          steps.activation.outcome == 'success' && steps.browser.outcome == 'success' && steps.runtime.outcome == 'success'
        env:
          SLUG: ${{ inputs.stylesheet }}
        run: |
          python3 "$RUNNER_TEMP/mrn-deploy-tools/tools/site-deploy/live_promotion.py" write \
            --receipt "$RUNNER_TEMP/site-promotion.json"
      - name: Publish passing pre-production promotion evidence
        id: promotion-evidence
        if: steps.promotion-record.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: site-promotion-${{ inputs.source_sha }}
          path: |
            ${{ runner.temp }}/site-promotion.json
            ${{ runner.temp }}/site-runtime-qa.md
          if-no-files-found: error
          retention-days: 90
      - name: Report site write boundary
        if: always()
        id: write-boundary
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          state = root / 'site-write-state.json'
          result = {'source_sha': os.environ['SOURCE_SHA'], 'target': os.environ['TARGET'],
                    'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                    'job_status': os.environ['JOB_STATUS']}
          if state.exists():
              result.update(json.loads(state.read_text()))
          else:
              # The controller persists its marker before sending any write request.
              result['write_phase'] = 'no-remote-write'
          phase = result['write_phase']
          if phase == 'no-remote-write':
              message = 'No remote write. The deployment never requested a backup or activation.'
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  print('no_remote_write=true', file=output)
          elif phase == 'activation-verified':
              if result['job_status'] == 'success':
                  message = 'Remote activation verified. Review the target acceptance evidence.'
              else:
                  message = 'Post-write failure after verified remote activation. Inspect rollback evidence before retrying.'
          elif phase == 'backup-verified':
              message = 'A remote backup was verified. Activation was never requested. Review the failed transfer before retrying.'
          else:
              message = 'A remote write was requested. Reconcile backup and host receipts before retrying.'
          result['message'] = message
          state.write_text(json.dumps(result, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              print(f'### {result["target"]} write outcome for `{result["source_sha"]}`\n\n{message}', file=summary)
          print(message)
          PY
      - name: Confirm no remote site write
        if: always() && steps.write-boundary.outputs.no_remote_write == 'true'
        run: echo 'No remote site write in this attempt.'
      - name: Preserve deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-deployment-${{ inputs.target }}-${{ inputs.source_sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/site-deployment.json
            ${{ runner.temp }}/site-write-state.json
            ${{ runner.temp }}/site-hotfix-approval.json
            ${{ runner.temp }}/site-hotfix-smoke.json
            ${{ runner.temp }}/site-release/site-release-qualification.json
            ${{ runner.temp }}/site-promotion/site-promotion.json
            ${{ runner.temp }}/site-artifact-verification.json
            ${{ runner.temp }}/site-rollback.json
            ${{ runner.temp }}/site-runtime-qa.md
            ${{ runner.temp }}/site-runtime-result.json
            ${{ runner.temp }}/site-local-qualification.json
            ${{ runner.temp }}/site-live-readback.json
            ${{ runner.temp }}/site-browser
            ${{ runner.temp }}/site-layout
          if-no-files-found: warn
          retention-days: 30
      - name: Remove runner credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/site-deploy.key" "$RUNNER_TEMP/site-deploy.known_hosts"
