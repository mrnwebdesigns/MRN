name: QA Engine CI

on:
  pull_request:
    paths:
      - "qa-engine/**"
      - ".github/workflows/qa-engine-ci.yml"
  push:
    branches:
      - main
    paths:
      - "qa-engine/**"
      - ".github/workflows/qa-engine-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-engine-sanity:
    name: qa-engine-sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: qa-engine/package-lock.json

      - name: Validate Bash scripts
        shell: bash
        run: |
          set -euo pipefail
          found_scripts=0
          while IFS= read -r script; do
            found_scripts=1
            echo "Syntax check: ${script}"
            bash -n "${script}"
          done < <(find qa-engine -type f \( -name '*.sh' -o -path 'qa-engine/bin/mrn-qa' \) | sort)

          if [[ "${found_scripts}" -eq 0 ]]; then
            echo "No Bash files found under qa-engine."
            exit 1
          fi

      - name: Install engine dependencies
        run: npm ci --prefix qa-engine

      - name: Validate Node syntax
        run: |
          set -euo pipefail
          node --check qa-engine/playwright.config.mjs
          node --check qa-engine/tests/playwright/smoke.spec.mjs

      - name: Validate CLI entrypoint
        run: |
          set -euo pipefail
          bash qa-engine/bin/mrn-qa --help >/dev/null

      - name: npm audit (high+)
        run: npm audit --prefix qa-engine --audit-level=high
