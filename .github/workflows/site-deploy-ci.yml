name: Site deployment tooling tests
on:
  pull_request:
    paths:
      - tools/site-deploy/**
      - .github/workflows/site-deploy-target.yml
      - .github/workflows/site-deploy.yml
      - .github/workflows/site-source-qa.yml
      - .github/workflows/site-deploy-ci.yml
      - .github/workflows/site-release-build.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable asset regression tests
        working-directory: tools/site-deploy
        run: npm ci --ignore-scripts && npm test
      - name: Deployment failure-path tests
        run: |
          python3 -m pip install -r tools/site-deploy/requirements-test.txt
          python3 -m unittest discover -s tools/site-deploy/tests -v
      - name: Validate shared and caller workflows
        run: |
          sed -e 's/TOOLING_SHA/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/g' \
            -e 's/SOURCE_PATH/public\/wp-content\/themes\/example-child/g' \
            -e 's/THEME_SLUG/example-child/g' \
            tools/site-deploy/site-deploy.yml.template > "$RUNNER_TEMP/site-deploy.yml"
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= \
            .github/workflows/site-deploy-target.yml .github/workflows/site-deploy-ci.yml \
            .github/workflows/site-release-build.yml .github/workflows/site-deploy.yml \
            .github/workflows/site-source-qa.yml \
            "$RUNNER_TEMP/site-deploy.yml"
