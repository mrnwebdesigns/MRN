name: Site deployment tooling tests
on:
  pull_request:
    paths:
      - stack/scripts/*bootstrap*.sh
      - stack/tests/test_dev_enrollment_bootstrap.py
      - tools/site-deploy/**
      - tools/cloudpanel/**
      - stack/scripts/bootstrap_readiness.py
      - stack/tests/test_bootstrap_readiness.py
      - tools/component-deploy/**
      - .github/workflows/site-deploy-target.yml
      - .github/workflows/site-deploy.yml
      - .github/workflows/site-source-qa.yml
      - .github/workflows/site-deploy-notify.yml
      - .github/workflows/site-deploy-ci.yml
      - .github/workflows/stack-promotion-drift.yml
      - .github/workflows/site-release-build.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  promotion-contract:
    # Fixtures only. This job has no site environment or deployment credentials.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise passing and blocked Live promotion contracts
        run: |
          python3 -m unittest discover -s tools/site-deploy/tests -p test_live_promotion.py -v
          python3 -m unittest discover -s tools/site-deploy/tests -p test_live_hotfix.py -v
      - name: Build disposable release archive
        env:
          PYTHONPATH: tools/site-deploy/tests
        run: |
          npm ci --ignore-scripts --prefix tools/site-deploy
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          from test_release import ReleaseArtifactContract as Fixture

          Fixture.setUpClass()
          try:
              root = Path(os.environ['RUNNER_TEMP'])
              shutil.copyfile(Fixture.archive, root / 'promotion-fixture.tar')
              with open(os.environ['GITHUB_ENV'], 'a') as env:
                  print('FIXTURE_SOURCE=' + Fixture.sha, file=env)
                  print('FIXTURE_SHA256=' + Fixture.expected, file=env)
          finally:
              Fixture.tearDownClass()
          PY
      - name: Retain immutable disposable archive
        id: fixture
        uses: actions/upload-artifact@v4
        with:
          name: promotion-ci-fixture-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion-fixture.tar
          if-no-files-found: error
          retention-days: 3
      # Artifact IDs are returned as soon as the upload completes, but GitHub's
      # download service can take a few seconds to index a newly-created ID.
      # Wait before the consumer assertion so this test exercises identity,
      # rather than intermittently racing that indexing step.
      - name: Await fixture artifact availability
        run: sleep 10
      - name: Retrieve the fixture by immutable artifact ID
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.fixture.outputs.artifact-id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/promotion-readback
          merge-multiple: true
      - name: Verify original bytes and reject a changed archive
        env:
          PYTHONPATH: tools/site-deploy
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from verify_release import verify

          archive = Path(os.environ['RUNNER_TEMP']) / 'promotion-readback/promotion-fixture.tar'
          args = (os.environ['FIXTURE_SHA256'], os.environ['FIXTURE_SOURCE'], '.', 'child')
          assert verify(archive, *args)['status'] == 'artifact-verified'
          with archive.open('ab') as stream:
              stream.write(b'changed')
          try:
              verify(archive, *args)
          except ValueError as error:
              assert 'checksum differs' in str(error)
          else:
              raise AssertionError('Live archive verifier admitted different bytes')
          print('GitHub artifact ID round trip preserved the exact archive and rejected changed bytes.')
          PY
  contract:
    # Match the browser runtime used by the reusable deployment workflow.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, zip, opcache, gd
          tools: wp-cli:2.12.0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Immutable asset regression tests
        working-directory: tools/site-deploy
        run: npm ci --ignore-scripts && npm test
      - name: Deployment failure-path tests
        run: |
          python3 -m pip install -r tools/site-deploy/requirements-test.txt -r tools/site-deploy/requirements-enrollment.txt -r tools/site-deploy/release_v1/requirements.txt
          python3 -m unittest discover -s tools/site-deploy/tests -v
          python3 -m unittest discover -s stack/tests -p test_dev_enrollment_bootstrap.py -v
          python3 -m unittest discover -s stack/tests -p test_bootstrap_readiness.py -v
      - name: Shared component artifact and WordPress loader tests
        env:
          MRN_COMPONENT_WP_ARCHIVE: ${{ runner.temp }}/wordpress-7.1.2.zip
          MRN_COMPONENT_SQLITE_ARCHIVE: ${{ runner.temp }}/sqlite-database-integration.3.0.2.zip
          MRN_COMPONENT_BROWSER: '1'
        run: |
          npm ci --ignore-scripts --prefix tools/component-deploy
          tools/component-deploy/node_modules/.bin/playwright install --with-deps chromium
          curl --fail --silent --show-error --location https://wordpress.org/wordpress-7.1.2.zip --output "$MRN_COMPONENT_WP_ARCHIVE"
          curl --fail --silent --show-error --location https://downloads.wordpress.org/plugin/sqlite-database-integration.3.0.2.zip --output "$MRN_COMPONENT_SQLITE_ARCHIVE"
          python3 -m unittest discover -s tools/component-deploy/tests -v
          python3 -m unittest discover -s tools/site-deploy/tests -p test_release_v1_wordpress.py -v
          MRN_RELEASE_TEST_PLAYWRIGHT_ROOT="$GITHUB_WORKSPACE/tools/component-deploy" node --test tools/site-deploy/tests/release-v1-browser.test.mjs
      - name: Install isolated source scanner
        run: bash tools/site-deploy/install-qa-python.sh
      - name: Scanner relocated-HOME regression
        run: python3 tools/site-deploy/tests/semgrep_home_regression.py
      - name: Validate shared and caller workflows
        run: |
          sed -e 's/TOOLING_SHA/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/g' \
            -e 's/SOURCE_PATH/public\/wp-content\/themes\/example-child/g' \
            -e 's/THEME_SLUG/example-child/g' \
            tools/site-deploy/site-deploy.yml.template > "$RUNNER_TEMP/site-deploy.yml"
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= \
            .github/workflows/site-deploy-target.yml .github/workflows/site-deploy-ci.yml \
            .github/workflows/site-release-build.yml .github/workflows/site-deploy.yml \
            .github/workflows/site-source-qa.yml \
            .github/workflows/site-deploy-notify.yml \
            "$RUNNER_TEMP/site-deploy.yml" tools/site-deploy/site-push.yml.template
          sed 's/TOOLING_SHA/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/g' \
            tools/site-deploy/site-deploy-failure.yml.template > "$RUNNER_TEMP/site-deploy-failure.yml"
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= "$RUNNER_TEMP/site-deploy-failure.yml"
