name: Site deployment tooling tests
on:
  pull_request:
    paths:
      - tools/site-deploy/**
      - .github/workflows/site-deploy-target.yml
      - .github/workflows/site-deploy-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Deployment failure-path tests
        run: python3 -m unittest discover -s tools/site-deploy/tests -v
      - name: Validate shared and caller workflows
        run: |
          sed -e 's/TOOLING_SHA/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/g' \
            -e 's/SOURCE_PATH/public\/wp-content\/themes\/example-child/g' \
            -e 's/THEME_SLUG/example-child/g' \
            tools/site-deploy/site-deploy.yml.template > "$RUNNER_TEMP/site-deploy.yml"
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= \
            .github/workflows/site-deploy-target.yml .github/workflows/site-deploy-ci.yml \
            "$RUNNER_TEMP/site-deploy.yml"
